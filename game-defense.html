<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070914" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c6ef7'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900'%3E%E7%BF%BC%3C/text%3E%3C/svg%3E" />
  <title>青崖守印 · 第十三站</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#070914;--line:rgba(255,255,255,.14);
      --text:#f8f4ff;--muted:#aab1c4;--pink:#e06cfa;--violet:#7c6ef7;--cyan:#06b6d4;--gold:#facc15;--danger:#fb7185;
    }
    body{
      min-height:100vh;overflow:hidden;background:
        radial-gradient(circle at 20% 12%,rgba(224,108,250,.18),transparent 30%),
        radial-gradient(circle at 82% 22%,rgba(6,182,212,.15),transparent 28%),
        linear-gradient(180deg,#070914,#101226 62%,#080b14);
      color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      -webkit-tap-highlight-color:transparent;user-select:none;
    }
    button,a{font:inherit}
    a{color:inherit;text-decoration:none}
    .shell{width:min(1180px,100vw);height:100vh;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px}
    .hud,.tower-bar,.toast,.modal-card,.tower-panel{
      border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.045));
      box-shadow:0 12px 36px rgba(0,0,0,.24);
    }
    .hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:22px}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}
    .mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;font-weight:900;box-shadow:0 0 28px rgba(224,108,250,.36)}
    .title strong{display:block;font-size:15px;letter-spacing:.04em}
    .title span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
    .stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .stat{border:1px solid rgba(255,255,255,.11);background:rgba(0,0,0,.18);border-radius:999px;padding:8px 11px;color:#eef2ff;font-size:13px;white-space:nowrap;transition:.2s}
    .stat b{color:var(--gold)}
    .stat.life b{color:#86efac}.stat.wave b{color:#93c5fd}
    .stat.flash{border-color:var(--danger);background:rgba(251,113,133,.22);transform:scale(1.06)}
    .top-btn{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#dce4ff;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:13px}
    .stage{position:relative;min-height:0;border:1px solid rgba(255,255,255,.1);border-radius:28px;overflow:hidden;background:#080c18;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 24px 80px rgba(0,0,0,.32)}
    canvas{display:block;width:100%;height:100%;touch-action:manipulation}
    .hint{
      position:absolute;left:14px;bottom:14px;max-width:min(460px,calc(100% - 28px));
      padding:10px 12px;border-radius:16px;background:rgba(6,9,20,.68);border:1px solid rgba(255,255,255,.1);
      color:#d8e0f4;font-size:13px;line-height:1.55;pointer-events:none;transition:opacity .8s;
    }
    .hint.fade{opacity:0}
    .toast{
      position:absolute;left:50%;top:78px;transform:translateX(-50%);border-radius:999px;padding:10px 16px;color:#f9fbff;font-size:14px;
      opacity:0;pointer-events:none;transition:.25s;z-index:5;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
    /* 塔面板 */
    .tower-panel{
      position:absolute;right:14px;top:14px;width:230px;border-radius:20px;padding:14px;z-index:6;
      display:none;flex-direction:column;gap:8px;background:rgba(10,13,28,.92);
    }
    .tower-panel.show{display:flex}
    .tower-panel h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
    .tower-panel h3 button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}
    .tower-panel p{color:var(--muted);font-size:12px;line-height:1.5}
    .panel-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#f1f5ff;border-radius:12px;padding:9px;cursor:pointer;font-size:13px}
    .panel-btn:hover{background:rgba(255,255,255,.12)}
    .panel-btn.gold{background:linear-gradient(135deg,rgba(250,204,21,.25),rgba(250,204,21,.1));border-color:rgba(250,204,21,.4)}
    /* 底部栏 */
    .tower-bar{display:grid;grid-template-columns:1.1fr repeat(4,1fr) 1.1fr auto auto;gap:8px;padding:10px;border-radius:24px;align-items:stretch}
    .wave-card{padding:10px 12px;border-radius:18px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.09)}
    .wave-card strong{font-size:14px}
    .wave-card p{color:var(--muted);font-size:12px;line-height:1.45;margin-top:3px}
    .wave-card .preview{color:#93c5fd;margin-top:4px;font-size:12px}
    .tower-btn,.primary,.hero-card,.skill-btn{
      border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);border-radius:18px;color:#f7f3ff;cursor:pointer;
      padding:10px 9px;text-align:left;transition:.16s;position:relative;overflow:hidden;
    }
    .tower-btn:before{content:"";position:absolute;inset:auto 10px 8px 10px;height:2px;background:var(--tower);box-shadow:0 0 16px var(--tower)}
    .tower-btn.active{border-color:var(--tower);background:color-mix(in srgb,var(--tower) 18%,rgba(255,255,255,.06));transform:translateY(-1px)}
    .tower-btn.poor{opacity:.45}
    .tower-btn small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    .hero-card{display:flex;flex-direction:column;gap:5px;justify-content:center}
    .hero-card.active{border-color:#c4b5fd;background:rgba(124,110,247,.16)}
    .hero-card .hname{font-size:13px;font-weight:800}
    .hero-card .hbar{height:5px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}
    .hero-card .hbar i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#c4b5fd);border-radius:99px;transition:width .2s}
    .hero-card small{color:var(--muted);font-size:11px}
    .skill-btn{text-align:center;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:74px}
    .skill-btn:disabled{opacity:.5;cursor:not-allowed}
    .skill-btn small{color:var(--muted);font-weight:400}
    .primary{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--pink),var(--violet));border:0;font-weight:900;min-width:120px;box-shadow:0 12px 34px rgba(124,110,247,.3)}
    .primary:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed}
    /* 结算 */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
    .modal.show{display:flex}
    .modal-card{width:min(470px,100%);border-radius:30px;padding:28px;text-align:center}
    .modal-card h1{font-size:34px;letter-spacing:-.04em;margin-bottom:6px}
    .modal-card p{color:var(--muted);line-height:1.75;margin-bottom:14px}
    .stars{font-size:34px;letter-spacing:.1em;margin-bottom:12px;height:42px}
    .star{color:rgba(255,255,255,.16)}
    .star.on{color:var(--gold);text-shadow:0 0 18px rgba(250,204,21,.6)}
    .modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .modal-actions .primary,.modal-actions .top-btn{min-width:130px;justify-content:center;text-align:center;padding:10px 14px}
    @media(max-width:980px){
      .tower-bar{grid-template-columns:repeat(4,1fr)}
      .wave-card{grid-column:1/-1}
      .hero-card{grid-column:span 2}
      .skill-btn{grid-column:span 2}
      .primary{grid-column:1/-1}
    }
    @media(max-width:640px){
      body{overflow:auto}
      .shell{height:100svh;padding:8px;gap:8px}
      .hud{align-items:flex-start;padding:8px 10px}
      .brand{gap:6px}.mark{width:28px;height:28px;border-radius:9px;font-size:13px}
      .title strong{font-size:13px;white-space:nowrap}
      .title span{display:none}
      .stats{gap:5px}.stat{font-size:12px;padding:6px 8px}.top-btn{font-size:12px;padding:6px 8px}
      .tower-bar{grid-template-columns:repeat(2,1fr);border-radius:20px;gap:6px;padding:8px}
      .wave-card{grid-column:1/-1}
      .hero-card,.skill-btn{grid-column:span 1}
      .primary{grid-column:1/-1}
      .tower-btn{padding:8px}.hint{font-size:12px}
      .tower-panel{width:200px;right:8px;top:8px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hud">
      <div class="brand">
        <div class="mark">翼</div>
        <div class="title"><strong>青崖守印</strong><span id="levelTag">第十三站支线 · 青崖入口</span></div>
      </div>
      <div class="stats">
        <span class="stat">🪙 灵石 <b id="gold">250</b></span>
        <span class="stat life">💎 核心 <b id="lives">20</b></span>
        <span class="stat wave">🌊 波次 <b id="wave">0/5</b></span>
        <button class="top-btn" id="speedBtn" type="button">▶ 1×</button>
        <button class="top-btn" id="muteBtn" type="button">🔊</button>
        <a class="top-btn" href="./arcade.html">大厅</a>
        <button class="top-btn" id="restartTop" type="button">重开</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="game" aria-label="青崖守印塔防游戏画面"></canvas>
      <div class="toast" id="toast"></div>
      <p class="hint" id="hint">选塔 → 点发光塔位建造；点塔可升级/出售；点沈烬明可调度站位；云翼营可设集结点。</p>
      <div class="tower-panel" id="towerPanel">
        <h3><span id="panelName">塔</span><button id="panelClose" type="button">✕</button></h3>
        <p id="panelInfo"></p>
        <button class="panel-btn gold" id="upgradeBtn" type="button">升级</button>
        <button class="panel-btn" id="rallyBtn" type="button">设集结点</button>
        <button class="panel-btn" id="sellBtn" type="button">出售</button>
      </div>
    </main>

    <footer class="tower-bar" aria-label="防御塔与英雄">
      <div class="wave-card">
        <strong id="statusTitle">准备防守</strong>
        <p id="statusText">选择底部防御塔，点击发光塔位建造。</p>
        <p class="preview" id="wavePreview"></p>
      </div>
      <button class="tower-btn active" type="button" data-tower="crossbow" style="--tower:#a78bfa">灵弩台 <small>60 · 极快补刀</small></button>
      <button class="tower-btn" type="button" data-tower="talisman" style="--tower:#22d3ee">符咒楼 <small>90 · 法术高伤</small></button>
      <button class="tower-btn" type="button" data-tower="barracks" style="--tower:#f0f9ff">云翼营 <small>80 · 翼卫拦截</small></button>
      <button class="tower-btn" type="button" data-tower="mortar" style="--tower:#fb923c">雷火瓮 <small>110 · 范围群伤</small></button>
      <button class="hero-card" id="heroCard" type="button">
        <span class="hname">沈烬明 <small id="heroLv">Lv.1</small></span>
        <span class="hbar"><i id="heroHp" style="width:100%"></i></span>
        <small>点击调度站位</small>
      </button>
      <button class="skill-btn" id="skillBtn" type="button" disabled>破围斩<small id="skillCd">Lv.3解锁</small></button>
      <button class="primary" id="startWave" type="button">开始第 1 波</button>
    </footer>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h1 id="modalTitle">防守成功</h1>
      <div class="stars" id="modalStars"></div>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="primary" id="again" type="button">再来一次</button>
        <a class="top-btn" href="./arcade.html">返回大厅</a>
      </div>
    </div>
  </div>

  <script src="./game/levels.js"></script>
  <script src="./game/engine.js"></script>
  <script>
    // hint 5 秒后淡出
    setTimeout(() => document.getElementById('hint').classList.add('fade'), 6000);
  </script>
</body>
</html>
